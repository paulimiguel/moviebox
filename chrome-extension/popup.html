<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar a MovieBox</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="moviebox-logo-white.png" alt="MovieBox" />
        <p>Agregar películas o series</p>
      </header>

      <section>
        <p id="page-host" class="page-host"></p>
        <label for="title">Títulos a agregar</label>
        <textarea id="title" autocomplete="off" placeholder="Ingresá un título por línea"></textarea>
        <div class="field-meta">
          <span>Podés escribir uno o varios, uno debajo del otro.</span>
          <span id="title-count">0 títulos</span>
        </div>
        <p id="status" class="status" aria-live="polite">Buscando el título de esta página…</p>
        <button id="open-moviebox" type="button" disabled>Abrir en MovieBox</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
